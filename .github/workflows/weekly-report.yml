name: Weekly NIDS-AI Report

on:
  schedule:
    # Monday at 09:47 Asia/Kolkata (04:17 UTC)
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nids-weekly-report
  cancel-in-progress: false

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NETRA_RUNTIME_ROLE: report_job
      NETRA_EVENT_BACKEND: postgresql
      NETRA_DELIVERY_BACKEND: postgresql
      NETRA_DATABASE_CONNECT_TIMEOUT_SECONDS: "10"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      NETRA_WEEKLY_REPORT_TO_EMAIL: ${{ secrets.NETRA_WEEKLY_REPORT_TO_EMAIL }}
      NETRA_EMAIL_TIMEOUT_SECONDS: "10"
      NETRA_EMAIL_MAX_ATTEMPTS: "4"
      # Manual runs are always dry runs. Only the scheduled event may send.
      NETRA_WEEKLY_REPORT_ENABLED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-report.txt

      - name: Install report dependencies
        run: python -m pip install -r requirements-report.txt

      - name: Validate required configuration
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure the DATABASE_URL repository secret."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ -z "$RESEND_API_KEY" ] ||
               [ -z "$RESEND_FROM_EMAIL" ] ||
               [ -z "$NETRA_WEEKLY_REPORT_TO_EMAIL" ]; then
              echo "::error::Configure RESEND_API_KEY, RESEND_FROM_EMAIL, and NETRA_WEEKLY_REPORT_TO_EMAIL repository secrets."
              exit 1
            fi
          fi

      - name: Run weekly report
        run: python -m v2.weekly_report
